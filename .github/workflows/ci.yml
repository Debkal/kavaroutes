name: KavaRoutes CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_vps:
        description: Deploy the verified release to the provisioned VPS
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      server: ${{ steps.scope.outputs.server }}
      web: ${{ steps.scope.outputs.web }}
      driver: ${{ steps.scope.outputs.driver }}
      site: ${{ steps.scope.outputs.site }}
      admin: ${{ steps.scope.outputs.admin }}
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Select affected suites
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-scope.mjs
      - run: node --test scripts/ci-scope.test.mjs
      - name: Release integrity and recovery drills
        run: python3 -m unittest discover -s infra/vps -p '*_test.py'
      - if: steps.scope.outputs.code == 'true'
        run: npm ci --ignore-scripts --no-audit
      - name: Build once and check boundaries
        if: steps.scope.outputs.code == 'true'
        run: |
          npm run build
          npm run check:architecture
          npm run check:project-audit
          npm run check:logging
          npm run check:governance
          git diff --exit-code governance/privacy/normalized/privacy-assurance-contract.json
      - name: Server and authentication contracts
        if: steps.scope.outputs.server == 'true'
        run: |
          node --test --test-concurrency=1 test/core.test.mjs test/architecture-negative.test.mjs test/api.test.mjs test/telemetry.test.mjs test/websocket.test.mjs test/smoke.test.mjs test/container-policy.test.mjs test/dependency-assurance.test.mjs test/deployment-provenance.test.mjs apps/api-host/test/*.test.mjs packages/google-identity/test/*.test.mjs
          npm run kavaroutes:database:lint
          npm run kavaroutes:api:test
          node --test --test-concurrency=1 packages/api-contracts/test/driver-session-issue.test.mjs infra/gcp/runtime/driver-sessions.test.mjs infra/gcp/runtime/road-routing.test.mjs
          # Generated contract artifacts must still describe the composed API:
          # regenerate from source and fail if anything committed is stale.
          npm run kavaroutes:api:catalog
          npm run kavaroutes:api:generate
          npm run kavaroutes:api:lint
          git diff --exit-code packages/api-contracts/artifacts packages/api-contracts/clients packages/api-contracts/src/client-web.generated.ts
          npm run kavaroutes:jobs:test
          npm run kavaroutes:realtime:test
          npm run kavaroutes:push:test
      - name: VM helper drills (mock-based, no Docker or VM)
        if: steps.scope.outputs.server == 'true'
        run: |
          python3 infra/gcp/runtime/promote-runtime.test.py
          python3 infra/gcp/runtime/push-runtime.test.py
          python3 infra/gcp/runtime/cloud-rollback.test.py
          python3 infra/gcp/runtime/cloud-health.test.py
      - name: Web client
        if: steps.scope.outputs.web == 'true'
        run: |
          npm run kavaroutes:web:test
          npm run kavaroutes:web:build
          npm run kavaroutes:web:build:driver
          npm run check:web-bundles
      - name: Public site and business authentication endpoints
        if: steps.scope.outputs.site == 'true'
        run: |
          npm run build --workspace=@kavaroutes/site
          npm run test --workspace=@kavaroutes/site
      - name: Admin service and endpoints
        if: steps.scope.outputs.admin == 'true'
        run: |
          npm run test --workspace=@kavaroutes/admin
          npm run build --workspace=@kavaroutes/admin
      - name: Driver contracts and UI
        if: steps.scope.outputs.driver == 'true'
        run: |
          npm run kavaroutes:driver:test
          npm run kavaroutes:driver:test:ui
          npm run kavaroutes:driver:lint
          npm run bundle:android --workspace=@kavaroutes/driver-native
          npm run bundle:ios --workspace=@kavaroutes/driver-native
      - name: Release dependency audit
        if: github.event_name == 'workflow_dispatch'
        run: npm audit --audit-level=moderate
      - name: Retain native Driver platform bundles
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: driver-bundles-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/driver-native/dist/android/
            apps/driver-native/dist/ios/
          if-no-files-found: error
          retention-days: 3

  vps-release:
    name: Verify complete VPS release
    needs: [checks, browser-acceptance]
    if: >-
      always() && !cancelled() && needs.checks.result == 'success' &&
      (needs.browser-acceptance.result == 'success' || needs.browser-acceptance.result == 'skipped') &&
      needs.checks.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      artifact: ${{ steps.release.outputs.artifact }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Build host verification tools
        run: |
          npm ci --ignore-scripts --no-audit
          npm run build
      - name: Build one release from this source revision
        id: release
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 infra/vps/release.py build /tmp/vps-release "$RELEASE_ID" "$GITHUB_SHA"
          printf 'artifact=vps-%s\n' "$RELEASE_ID" >> "$GITHUB_OUTPUT"
          printf 'RELEASE_ID=%s\n' "$RELEASE_ID" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest=json.loads(Path('/tmp/vps-release/manifest.json').read_text())
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('KR_CLOUD_IMAGE='+manifest['images']['runtime']['id']+'\n')
          PY
      - name: Verify runtime provenance and PostgreSQL command integration
        env:
          KR_CLOUD_LOCAL_TEST: '1'
        run: |
          node infra/gcp/runtime/image-evidence.mjs "$KR_CLOUD_IMAGE"
          node --test --test-isolation=none infra/gcp/runtime/integration.test.mjs
      - name: Check production Compose and authentication boundaries
        run: python3 infra/vps/smoke.py "$RELEASE_ID"
      - name: Retain exact tested release and evidence
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.release.outputs.artifact }}
          path: /tmp/vps-release/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Retain runtime verification evidence
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vps-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: .tooling/gcp/image-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy-vps:
    name: Deploy verified VPS release
    needs: vps-release
    # Only a successful manual run of trusted main can reach the private runner.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_vps
    runs-on: [self-hosted, linux, x64, kavaroutes-vps]
    environment: production
    timeout-minutes: 30
    concurrency:
      group: kavaroutes-vps-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.vps-release.outputs.artifact }}
          path: ${{ runner.temp }}/kavaroutes-vps-release
      - name: Verify, back up, migrate, start and check exact images
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/kavaroutes-vps-release
          SOURCE_COMMIT: ${{ github.sha }}
          VPS_ENV_FILE: ${{ vars.KR_VPS_ENV_FILE || '/etc/kavaroutes/vps.env' }}
          VPS_RELEASE_ROOT: ${{ vars.KR_VPS_RELEASE_ROOT || '/opt/kavaroutes-vps/releases' }}
        run: |
          artifact="$RELEASE_DIRECTORY"
          test -f "$artifact/manifest.json"
          sudo -n python3 "$artifact/deploy.py" "$artifact" "$SOURCE_COMMIT" "$VPS_ENV_FILE" "$VPS_RELEASE_ROOT"

  browser-acceptance:
    name: Web browser acceptance and accessibility
    needs: checks
    # Opt-in lane. It runs on the manual release dispatch and on any pull request
    # or push that selects the web scope; anything else leaves this job skipped,
    # which GitHub reports explicitly instead of as a silent pass.
    if: github.event_name == 'workflow_dispatch' || needs.checks.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # The browsers in this image are the ones the recorded WP011 report used.
      # Pinned by digest because the repository pins every other dependency.
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      # The pinned image ships only the "headless shell" runtime that
      # @playwright/test 1.62.1 does not use, plus the browser revisions that
      # `playwright install` would otherwise pre-install globally. Without this
      # override the job resolves /home/pwuser/.cache/ms-playwright (owned by the
      # image) while `npm ci` runs as root and looks in /root/.cache, so
      # chromium-1440/narrow/wide die at launch (run 35183633879) and the global
      # firefox/webkit revisions lack the OS libraries for this host
      # (libgtk-4-1, libxslt1.1, libflite1, libgles2). Pointing the cache at a
      # job-local directory makes `playwright install` idempotent: it downloads
      # exactly the revisions 1.62.1 declares and installs their dependencies.
      options: --ipc=host -e PLAYWRIGHT_BROWSERS_PATH=/tmp/ms-playwright
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Install the browser revisions this suite pins
        run: |
          # A fresh cache directory: the image's own browsers are not the
          # revisions @playwright/test 1.62.1 launches (firefox 1538, webkit 2336).
          npx playwright install --with-deps chromium firefox webkit
      - name: Build once
        env:
          # This job is the only place that asks for the fixture-backed
          # `local-synthetic` surface, because it is the browser harness. The
          # shipped bundle and `npm run dev` default to the persisted backend.
          VITE_KAVAROUTES_BACKEND: local-synthetic
        run: |
          npm run build
          npm run kavaroutes:web:build
      - name: Playwright chromium, firefox and webkit with axe accessibility checks
        env:
          # Recorded in apps/web/artifacts/browser-report.json so the retained
          # evidence names the exact container the browsers came from.
          KR_BROWSER_IMAGE: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
        run: npm run kavaroutes:web:test:browsers
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/web/artifacts/browser-report.json
            apps/web/test-results/
          if-no-files-found: warn
          retention-days: 3
