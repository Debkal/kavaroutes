name: KavaRoutes CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      server: ${{ steps.scope.outputs.server }}
      web: ${{ steps.scope.outputs.web }}
      driver: ${{ steps.scope.outputs.driver }}
      site: ${{ steps.scope.outputs.site }}
      admin: ${{ steps.scope.outputs.admin }}
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Select affected suites
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-scope.mjs
      - run: node --test scripts/ci-scope.test.mjs
      - if: steps.scope.outputs.code == 'true'
        run: npm ci --ignore-scripts --no-audit
      - name: Build once and check boundaries
        if: steps.scope.outputs.code == 'true'
        run: |
          npm run build
          npm run check:architecture
          npm run check:logging
          npm run check:governance
          git diff --exit-code governance/privacy/normalized/privacy-assurance-contract.json
      - name: Server and authentication contracts
        if: steps.scope.outputs.server == 'true'
        run: |
          node --test --test-concurrency=1 test/core.test.mjs test/architecture-negative.test.mjs test/api.test.mjs test/telemetry.test.mjs test/websocket.test.mjs test/smoke.test.mjs test/container-policy.test.mjs apps/api-host/test/*.test.mjs packages/google-identity/test/*.test.mjs
          npm run kavaroutes:database:lint
          npm run kavaroutes:api:test
          node --test --test-concurrency=1 packages/api-contracts/test/driver-session-issue.test.mjs infra/gcp/runtime/driver-sessions.test.mjs
          # Generated contract artifacts must still describe the composed API:
          # regenerate from source and fail if anything committed is stale.
          npm run kavaroutes:api:catalog
          npm run kavaroutes:api:generate
          npm run kavaroutes:api:lint
          git diff --exit-code packages/api-contracts/artifacts packages/api-contracts/clients packages/api-contracts/src/client-web.generated.ts
          npm run kavaroutes:jobs:test
          npm run kavaroutes:realtime:test
          npm run kavaroutes:push:test
      - name: VM helper drills (mock-based, no Docker or VM)
        if: steps.scope.outputs.server == 'true'
        run: |
          python3 infra/gcp/runtime/promote-runtime.test.py
          python3 infra/gcp/runtime/push-runtime.test.py
          python3 infra/gcp/runtime/cloud-rollback.test.py
          python3 infra/gcp/runtime/cloud-health.test.py
      - name: Web client
        if: steps.scope.outputs.web == 'true'
        run: |
          npm run kavaroutes:web:test
          npm run kavaroutes:web:build
      - name: Public site and business authentication endpoints
        if: steps.scope.outputs.site == 'true'
        run: |
          npm run build --workspace=@kavaroutes/site
          npm run test --workspace=@kavaroutes/site
      - name: Admin service and endpoints
        if: steps.scope.outputs.admin == 'true'
        run: |
          npm run test --workspace=@kavaroutes/admin
          npm run build --workspace=@kavaroutes/admin
      - name: Driver contracts and UI
        if: steps.scope.outputs.driver == 'true'
        run: |
          npm run kavaroutes:driver:test
          npm run kavaroutes:driver:test:ui
      - name: Release dependency audit
        if: github.event_name == 'workflow_dispatch'
        run: npm audit --audit-level=moderate
      - name: Build single release candidate
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker build --iidfile /tmp/kavaroutes-image-id -f infra/gcp/runtime/Dockerfile .
          printf 'KR_CLOUD_IMAGE=%s\n' "$(cat /tmp/kavaroutes-image-id)" >> "$GITHUB_ENV"
      - name: Verify exact candidate and disposable PostgreSQL integration
        if: github.event_name == 'workflow_dispatch'
        env:
          KR_CLOUD_LOCAL_TEST: '1'
        run: |
          node infra/gcp/runtime/image-evidence.mjs "$KR_CLOUD_IMAGE"
          node --test --test-isolation=none infra/gcp/runtime/integration.test.mjs
          git rev-parse HEAD > .tooling/gcp/image-evidence/source-commit.txt
          docker save "$KR_CLOUD_IMAGE" | gzip > /tmp/kavaroutes-runtime.tar.gz
      - name: Package separately built live applications
        if: github.event_name == 'workflow_dispatch'
        run: |
          tar -czf /tmp/kavaroutes-web.tar.gz -C apps/web dist
          tar -czf /tmp/kavaroutes-site.tar.gz -C apps/site dist server package.json
          tar -czf /tmp/kavaroutes-admin.tar.gz -C apps/admin src bin public package.json
          sha256sum /tmp/kavaroutes-runtime.tar.gz /tmp/kavaroutes-web.tar.gz /tmp/kavaroutes-site.tar.gz /tmp/kavaroutes-admin.tar.gz > /tmp/kavaroutes-live-bundles.sha256
      - name: Retain verified candidate (no deployment)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            /tmp/kavaroutes-runtime.tar.gz
            .tooling/gcp/image-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Retain live app bundles and endpoint evidence
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-apps-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            /tmp/kavaroutes-web.tar.gz
            /tmp/kavaroutes-site.tar.gz
            /tmp/kavaroutes-admin.tar.gz
            /tmp/kavaroutes-live-bundles.sha256
          if-no-files-found: error
          retention-days: 3

  browser-acceptance:
    name: Web browser acceptance and accessibility
    needs: checks
    # Opt-in lane. It runs on the manual release dispatch and on any pull request
    # or push that selects the web scope; anything else leaves this job skipped,
    # which GitHub reports explicitly instead of as a silent pass.
    if: github.event_name == 'workflow_dispatch' || needs.checks.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # The browsers in this image are the ones the recorded WP011 report used.
      # Pinned by digest because the repository pins every other dependency.
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      # The pinned image ships only the "headless shell" runtime that
      # @playwright/test 1.62.1 does not use, plus the browser revisions that
      # `playwright install` would otherwise pre-install globally. Without this
      # override the job resolves /home/pwuser/.cache/ms-playwright (owned by the
      # image) while `npm ci` runs as root and looks in /root/.cache, so
      # chromium-1440/narrow/wide die at launch (run 35183633879) and the global
      # firefox/webkit revisions lack the OS libraries for this host
      # (libgtk-4-1, libxslt1.1, libflite1, libgles2). Pointing the cache at a
      # job-local directory makes `playwright install` idempotent: it downloads
      # exactly the revisions 1.62.1 declares and installs their dependencies.
      options: --ipc=host -e PLAYWRIGHT_BROWSERS_PATH=/tmp/ms-playwright
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Install the browser revisions this suite pins
        run: |
          # A fresh cache directory: the image's own browsers are not the
          # revisions @playwright/test 1.62.1 launches (firefox 1538, webkit 2336).
          npx playwright install --with-deps chromium firefox webkit
      - name: Build once
        env:
          # This job is the only place that asks for the fixture-backed
          # `local-synthetic` surface, because it is the browser harness. The
          # shipped bundle and `npm run dev` default to the persisted backend.
          VITE_KAVAROUTES_BACKEND: local-synthetic
        run: |
          npm run build
          npm run kavaroutes:web:build
      - name: Playwright chromium, firefox and webkit with axe accessibility checks
        env:
          # Recorded in apps/web/artifacts/browser-report.json so the retained
          # evidence names the exact container the browsers came from.
          KR_BROWSER_IMAGE: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
        run: npm run kavaroutes:web:test:browsers
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/web/artifacts/browser-report.json
            apps/web/test-results/
          if-no-files-found: warn
          retention-days: 3
