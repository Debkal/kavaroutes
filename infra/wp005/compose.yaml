name: kavaroutes-wp005
services:
  postgres:
    image: postgis/postgis:17-3.5@sha256:624f5195b91d424dbebf018890148cc0e5a3e80db5467da8b53cc2ed2ce49216
    environment:
      POSTGRES_DB: kavaroutes_wp005
      POSTGRES_USER: wp005
      POSTGRES_PASSWORD: ${WP005_POSTGRES_PASSWORD:?set WP005_POSTGRES_PASSWORD locally}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wp005 -d kavaroutes_wp005"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - wp005-postgres:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    shm_size: 128m
    ulimits:
      nofile: { soft: 1024, hard: 2048 }
    stop_grace_period: 20s
  api:
    build:
      context: ../..
      dockerfile: infra/wp005/api.Dockerfile
    environment:
      NODE_ENV: "development"
      KAVAROUTES_RUNTIME_PROFILE: "local-synthetic"
      HOST: "127.0.0.1"
      PORT: "3000"
    read_only: true
    tmpfs: ["/tmp:size=67108864,mode=1777,noexec,nosuid,nodev"]
    user: node
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    ulimits:
      nofile: { soft: 1024, hard: 2048 }
    depends_on:
      postgres: { condition: service_healthy }
    stop_grace_period: 10s
  worker:
    build:
      context: ../..
      dockerfile: infra/wp005/worker.Dockerfile
    environment:
      DATABASE_URL: postgresql://wp005:${WP005_POSTGRES_PASSWORD}@postgres:5432/kavaroutes_wp005
    read_only: true
    tmpfs: ["/tmp:size=67108864,mode=1777,noexec,nosuid,nodev"]
    user: node
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    ulimits:
      nofile: { soft: 1024, hard: 2048 }
    depends_on:
      postgres: { condition: service_healthy }
    stop_grace_period: 10s
volumes:
  wp005-postgres:
