[Service]
ExecStart=
ExecStart=/usr/bin/docker compose --env-file /opt/kavaroutes/runtime/vm.env -f /opt/kavaroutes/runtime/compose.yaml -f /opt/kavaroutes/runtime/prototype-compose.override.yaml up -d --wait --wait-timeout 120 --pull never postgres api worker gateway
ExecStop=
ExecStop=/usr/bin/docker compose --env-file /opt/kavaroutes/runtime/vm.env -f /opt/kavaroutes/runtime/compose.yaml -f /opt/kavaroutes/runtime/prototype-compose.override.yaml stop --timeout 30
